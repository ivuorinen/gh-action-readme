---
# Trivy secret-scanning config (auto-loaded via the default --secret-config path).
#
# The nitpicker findings ledger (docs/audit/findings/) records RESOLVED findings
# N-27 and SEC-003, which are themselves about a fake placeholder GitHub token
# that was removed from a test fixture. Their resolution notes quote that
# placeholder verbatim, so Trivy re-flags the quote as a github-pat secret.
#
# This allow-rule suppresses only that exact placeholder string, so detection of
# any real GitHub PAT anywhere in the repo is unaffected.
allow-rules:
  - id: nitpicker-findings-fake-github-token
    description: Fake placeholder token quoted in resolved findings N-27/SEC-003; not a real credential.
    regex: ghp_test1234567890
