---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 0"
  merge_group:

# Cancel superseded in-progress runs for the same PR only; merge_group,
# scheduled, and main runs must always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "go"]
    steps:
      - name: CodeQL Analysis
        uses: ivuorinen/actions/codeql-analysis@f7725f210c6740ae8042fbe89f2024dabad8a535 # v2026.07.11
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
