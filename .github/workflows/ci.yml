---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded in-progress runs for the same PR; never cancel main or
# other event runs (a push to main should always complete).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: Setup Node.js for EditorConfig tools
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install EditorConfig tools
        run: npm install -g --ignore-scripts eclint@2.8.1
      - name: Check EditorConfig compliance
        run: eclint check .
      - name: Run unit tests with coverage gate
        run: make test-coverage-check
      # Publishes coverage.out (written by the step above) to SonarCloud. This
      # requires CI-based analysis: SonarCloud's Automatic Analysis cannot import
      # coverage, so sonar.go.coverage.reportPaths is ignored under it and the
      # "Coverage on New Code >= 80%" gate condition never evaluates. Automatic
      # Analysis must be OFF in the project's Analysis Method settings or this
      # step fails with "You are running CI analysis while Automatic Analysis is
      # enabled". Skipped on fork PRs, where secrets are unavailable.
      - name: SonarCloud scan
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Run unit tests under the race detector
        run: make test-race
      - name: Run property-based tests
        run: make test-property
      - name: Verify dependency licences and third-party notices
        run: make licenses
      - name: Example Action Readme Generation
        run: |
          go run . gen testdata/example-action --output example-README.md
      - name: Comprehensive Documentation Generation
        run: |
          # Create docs directory
          mkdir -p docs

          # Generate multiple formats for different actions to demonstrate new functionality
          echo "Generating documentation for example-action..."
          go run . gen testdata/example-action/ --output "$PWD/docs/example-action.md"
          go run . gen testdata/example-action/ -f html --output "$PWD/docs/example-action.html"
          go run . gen testdata/example-action/ -f json --output "$PWD/docs/example-action.json"

          echo "Generating documentation for composite-action..."
          go run . gen testdata/composite-action/ --output "$PWD/docs/composite-action.md"
          go run . gen testdata/composite-action/ -f html --output "$PWD/docs/composite-action.html"

          # Test single file targeting
          echo "Generating from specific action.yml files..."
          go run . gen testdata/example-action/action.yml --output "$PWD/docs/direct-example.md"
          go run . gen testdata/composite-action/action.yml --output "$PWD/docs/direct-composite.md"

          # Test recursive generation with different themes. Recursive runs resolve
          # multiple action files, so they must use --output-dir (one file per action)
          # rather than --output (a single filename), which the generator rejects.
          echo "Testing recursive generation with themes..."
          go run . gen testdata/ --recursive --theme minimal -f html --output-dir "$PWD/docs/all-actions-minimal"
          go run . gen testdata/ --recursive --theme professional -f json --output-dir "$PWD/docs/all-actions-professional"

          # Verify files were generated
          echo "Verifying generated documentation files..."
          ls -la docs/
      - name: Upload Generated Documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: generated-documentation
          path: |
            docs/
            testdata/example-action/example-README.md
          retention-days: 7
