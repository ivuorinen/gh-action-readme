# SonarCloud project configuration
sonar.projectKey=ivuorinen_gh-action-readme
sonar.organization=ivuorinen

# Source and test paths
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,**/dist/**,\
	.serena/**,.claude/**,**/.git/**,**/test_constants.go

# Go specific settings
sonar.go.coverage.reportPaths=coverage.out

# Coverage exclusions: still analysed for bugs and code smells, but not counted
# in the coverage metric.
#
# testutil/ is the shared test-helper package. It cannot use the _test.go suffix
# — that would make it unimportable by every other package's tests — so Sonar
# indexes it as production source. It is not: nothing outside a _test.go file
# imports it (enforced by the depguard rule in .golangci.yml), and it is never
# linked into the binary. Measuring it reports how much test scaffolding the
# suite happens to exercise, which is not a quality signal, while hiding the
# real figure for shipped code behind ~940 statements of helpers.
#
# main.go is deliberately NOT excluded. Only main() and initConfig() are
# untestable entry points; the rest of the file is covered, and
# wrapHandlerWithErrorHandling sits at 57% — a genuine gap that a blanket
# file-level exclusion would hide along with them.
sonar.coverage.exclusions=testutil/**

# Disable go:S100 (function naming) for test files
# Rationale: Go convention uses underscores in test names for readability
# (e.g., TestFoo_EdgeCase is more readable than TestFooEdgeCase)
sonar.issue.ignore.multicriteria=e1

sonar.issue.ignore.multicriteria.e1.ruleKey=go:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
