title = "gh-action-readme gitleaks configuration"

[extend]
useDefault = true

# Allowlist for test files and fixtures that intentionally contain placeholder tokens.
# These are not real secrets and are used only for testing purposes.
[allowlist]
description = "Test fixture files containing placeholder tokens"
paths = [
	'''^testutil/test_constants\.go$''',
	'''^testdata/''',
	'''_test\.go$''',
	'''^integration_test\.go$''',
	'''^\.serena/''',
	# Audit reports are tracked in git and intentionally quote documented fake
	# token values when describing past secret-scanning findings (e.g.
	# N27/SEC-003); they are excluded from gitleaks scanning. Do not place real
	# secrets here.
	'''^docs/audit/''',
]
