---
# GoReleaser configuration for gh-action-readme
# See: https://goreleaser.com

version: 2

project_name: gh-action-readme

before:
  hooks:
    # Run tests before building
    - go test ./...
    # Ensure dependencies are tidy
    - go mod tidy
    # Verify permissive deps and regenerate the bundled license attribution
    - make licenses

builds:
  - id: gh-action-readme
    binary: gh-action-readme
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    goarm:
      - "6"
      - "7"
    ignore:
      # Skip 32-bit builds for macOS (not supported)
      - goos: darwin
        goarch: "386"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

archives:
  - id: default
    formats: [tar.gz]
    # Use zip for Windows
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else if eq .Arch "386" }}i386 {{- else }}{{ .Arch }}{{ end }} {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE*
      - THIRD_PARTY_LICENSES.md
      - CHANGELOG.md
      - docs/*.md
      - schemas/*.json

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "^ci:"
      - "^docs:"
      - "merge conflict"
      - "Merge pull request"
      - "Merge remote-tracking branch"
      - "Merge branch"
  groups:
    - title: 🚀 Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 🐛 Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 📝 Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 🔨 Dependencies
      regexp: '^.*?(feat|fix|chore)\(deps\)!?:.+$'
      order: 3
    - title: Others
      order: 999

release:
  github:
    owner: ivuorinen
    name: gh-action-readme
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## 🎉 {{ .ProjectName }} {{ .Tag }}

    Welcome to this new release of **{{ .ProjectName }}**!

    ### 📦 Installation

    #### Download Binary
    ```bash
    # Set base URL for downloads
    BASE_URL="https://github.com/ivuorinen/gh-action-readme/releases/download/{{ .Tag }}"

    # Linux x86_64
    curl -L $BASE_URL/gh-action-readme_Linux_x86_64.tar.gz | tar -xz

    # macOS x86_64
    curl -L $BASE_URL/gh-action-readme_Darwin_x86_64.tar.gz | tar -xz

    # macOS ARM64 (Apple Silicon)
    curl -L $BASE_URL/gh-action-readme_Darwin_arm64.tar.gz | tar -xz

    # Windows x86_64
    # Download gh-action-readme_Windows_x86_64.zip and extract
    ```

    #### Using Go
    ```bash
    go install github.com/ivuorinen/gh-action-readme@{{ .Tag }}
    ```

    ### 🔍 What's Changed

  footer: |
    ---

    **Full Changelog**: https://github.com/ivuorinen/gh-action-readme/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### 🙏 Thanks

    Thanks to all contributors who made this release possible!

